name: check

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  MOON_WORK: "off"

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        toolchain: [latest, nightly]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: hustcer/setup-moonbit@develop
        with:
          version: ${{ matrix.toolchain }}
      - name: Setup MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Toolchain and dependencies
        run: |
          moon version --all
          moon update
      # Public Show implementations generate LLVM IR. Keep their legacy Show
      # and constructor deprecations (20/27) visible outside this strict gate;
      # changing them to Debug would change public formatting behavior.
      # All other warnings remain errors, including in documentation tests.
      - name: Check all targets
        run: moon check --target all --deny-warn --warn-list '-20-27'
      - name: Verify interfaces
        run: |
          moon info --target all
          git diff --exit-code
      - name: Verify formatting
        run: |
          moon fmt
          git diff --exit-code
      - name: Test all targets and documentation
        run: |
          moon test --target all --deny-warn --warn-list '-20-27'
          moon test --target all --release --deny-warn --warn-list '-20-27'
